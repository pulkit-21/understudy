# Minimal Alembic config. The URL and script location are injected at runtime
# by app/db/migrate.py (so migrations work from any cwd and honour DATABASE_URL);
# this file is here for the `alembic` CLI when authoring new revisions.
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./data/understudy.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
