<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<style>
  :root { --ink:#1c2430; --mut:#67707d; --line:#dde2e8; --bg:#f5f6f8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 "Segoe UI", system-ui, sans-serif;
         color:var(--ink); background:var(--bg); }
  header.appbar { display:flex; align-items:center; gap:10px;
    padding:12px 28px; color:#fff; background:var(--brand); }
  header.appbar .logo { font-weight:700; letter-spacing:.4px; font-size:17px; }
  header.appbar .env { margin-left:auto; font-size:12px; opacity:.85;
    border:1px solid rgba(255,255,255,.5); padding:2px 8px; border-radius:3px; }
  main { max-width:880px; margin:28px auto; padding:0 20px; }
  h1 { font-size:21px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 22px; }
  table { width:100%; border-collapse:collapse; background:#fff;
    border:1px solid var(--line); }
  th { text-align:left; font-size:12px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--mut); padding:10px 14px;
    border-bottom:1px solid var(--line); }
  td { padding:11px 14px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:none; }
  a { color:var(--brand); }
  .card { background:#fff; border:1px solid var(--line); padding:24px 28px; }
  .kv { display:grid; grid-template-columns:180px 1fr; row-gap:10px; }
  .kv dt { color:var(--mut); }
  .kv dd { margin:0; font-weight:600; }
  label { display:block; font-size:13px; color:var(--mut); margin:14px 0 4px; }
  input, select { width:100%; padding:9px 10px; font:inherit;
    border:1px solid var(--line); border-radius:4px; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--brand); outline-offset:1px; }
  button { margin-top:20px; padding:10px 22px; font:inherit; font-weight:600;
    color:#fff; background:var(--brand); border:none; border-radius:4px;
    cursor:pointer; }
  .notice { background:#eef7ef; border:1px solid #bfe3c2; padding:14px 18px;
    margin-bottom:20px; border-radius:4px; }
  .right { text-align:right; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
  .toolbar input, .toolbar select { width:auto; flex:1; }
  .badge { display:inline-block; font-size:11.5px; font-weight:600;
    padding:2px 9px; border-radius:999px; border:1px solid transparent; }
  .badge.approved { background:#e7f4ec; color:#1f7a5c; border-color:#bfe3c2; }
  .badge.pending  { background:#fef6e6; color:#8a5a00; border-color:#f2dca0; }
  .badge.hold     { background:#fdecec; color:#a3282a; border-color:#f0bcbc; }
  .badge.paid     { background:#eef1f6; color:#3b4658; border-color:#d3dae6; }
  .badge.posted   { background:#eaf1fb; color:#2a5db0; border-color:#c3d7f2; }
  .totals { margin-top:14px; display:grid; grid-template-columns:1fr auto;
    row-gap:6px; max-width:340px; margin-left:auto; }
  .totals .lbl { color:var(--mut); }
  .totals .amt { text-align:right; font-weight:600; }
  .btn-link { display:inline-block; margin-top:0; padding:6px 12px; font-size:13px; }
</style>
</head>
<body style="--brand: {{ brand_color }}">
<header class="appbar">
  <span class="logo">{{ brand_name }}</span>
  <span class="env">sandbox</span>
</header>
<main>{% block body %}{% endblock %}</main>
<!-- Understudy in-browser recorder + rrweb session replay: inert unless recording -->
<script src="/rrweb.min.js"></script>
<script src="/recorder.js" defer></script>
</body>
</html>
